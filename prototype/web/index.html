<style>

  .toast { position:fixed; left:50%; bottom:96px; transform:translateX(-50%); background:var(--ink); color:#fff; padding:9px 16px; border-radius:999px; font-size:14px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:30; } .toast.show { opacity:1; }
  .spin { width:28px; height:28px; border:3px solid var(--line); border-top-color:var(--orange); border-radius:50%; animation:sp 1s linear infinite; margin:20px auto; } @keyframes sp { to { transform:rotate(360deg); } }
  .muted { color:var(--muted); } .small { font-size:13px; }
  .pk { display:flex; gap:12px; align-items:center; width:100%; text-align:left; background:#fff; border:2px solid var(--line); border-radius:18px; padding:12px; font:inherit; cursor:pointer; margin-bottom:10px; }
  .pk.on { border-color:var(--orange); background:var(--orange-soft); } .pk .av { width:56px; height:56px; border-radius:50%; background:var(--teal); display:flex; align-items:center; justify-content:center; flex:none; overflow:hidden; } .pk .av img { width:50px; height:50px; }
  .pk b { display:block; font-size:16px; } .pk .tick { margin-left:auto; width:28px; height:28px; border-radius:50%; border:2px solid var(--line); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; flex:none; } .pk.on .tick { background:var(--orange); border-color:var(--orange); }
  .cal { user-select:none; } .cal .hd { display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; } .cal .hd b { font-size:16px; color:var(--navy); }
  .cal .g { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; } .cal .w { text-align:center; font-size:12px; color:var(--muted); padding:2px 0; }
  .cal button.d { aspect-ratio:1; border:0; border-radius:12px; background:var(--page); font:inherit; font-size:15px; color:var(--ink); cursor:pointer; min-height:38px; }
  .cal button.d.o { background:var(--orange); color:#fff; font-weight:700; } .cal button.d.n { background:var(--blue); color:#fff; font-weight:700; } .cal button.d.t { outline:2px solid var(--navy); } .cal button.d:disabled { opacity:.3; cursor:default; } .cal i.e { visibility:hidden; }
  .lg { display:flex; gap:12px; flex-wrap:wrap; font-size:13px; color:var(--muted); margin:8px 0; } .lg span::before { content:""; display:inline-block; width:12px; height:12px; border-radius:4px; margin-right:5px; vertical-align:-1px; background:var(--page); } .lg .o::before { background:var(--orange); } .lg .n::before { background:var(--blue); }
  .dayrow { display:flex; align-items:center; gap:10px; padding:6px 0; border-top:1px solid var(--line); } .dayrow .tag { font-size:12px; font-weight:700; color:#fff; border-radius:999px; padding:2px 9px; } .dayrow .tag.o { background:var(--orange); } .dayrow .tag.n { background:var(--blue); } .dayrow input { width:90px; margin-left:auto; }
  .opt { display:flex; gap:12px; align-items:center; width:100%; text-align:left; background:#fff; border:2px solid var(--line); border-radius:18px; padding:12px; font:inherit; cursor:pointer; margin-bottom:10px; } .opt b { display:block; font-size:16px; } .opt img { width:52px; height:52px; flex:none; }

</style>

<body>

<script>
/* Belka web app — แท็บ ร้าน · ลูกค้า · ไอเดีย · วิเคราะห์ + ถาม Belka
 * AI (Bedrock): /api/plan, /api/ask · โค้ดล้วน: /api/calc/*, /api/personas, /api/ideas, /api/trends, /api/memory, /api/redline */
/* กันลิงก์ปลอม ?api=เว็บคนอื่น: ใช้ ?api= ได้เฉพาะตอนเปิดไฟล์จากเครื่อง และชี้ได้แค่ 127.0.0.1 / localhost */
const API = (() => { if (location.protocol !== "file:") return ""; const q = (new URLSearchParams(location.search).get("api") || "").replace(/\/$/, ""); return /^http:\/\/(127\.0\.0\.1|localhost)(:\d{2,5})?$/.test(q) ? q : "http://127.0.0.1:8000"; })();

const SEG_STK = { "นักศึกษา":"backpack", "วัยทำงาน":"laptop", "ครอบครัว":"shop-hug", "วัยอาวุโส":"reading", "นักท่องเที่ยว":"backpack-wink", "สายสุขภาพ":"gardener", "พรีเมียม":"sunglasses-coins", "องค์กร/พ่อค้าแม่ค้า":"tablet-tie" };

const OPT_STK = { drink:"icon-cafe", bakery:"coffee-stall", food:"market-stall", workers:"laptop", students:"backpack", locals:"shop-hug", tourists:"backpack-wink", line:"phone-check-2", facebook:"megaphone", google_maps:"icon-map-pin", delivery:"icon-truck", none:"plant-pot" };

const ARCH_STK = { "คนซื้อของฝากไปบ้าน":"basket", "ครอบครัวมื้อเย็นวันหยุด":"shop-hug", "พ่อแม่รับส่งลูก":"backpack",
  "คนเดินทางผ่านย่าน":"backpack-wink", "นักท่องเที่ยวต่างชาติสายสตรีทฟู้ด":"market-stall", "นักท่องเที่ยวไทยสายคาเฟ่":"bubble-tea",
  "นักศึกษากิจกรรมชมรม":"megaphone", "นักศึกษาสายคอนเทนต์/ครีเอเตอร์":"phone-check", "นักศึกษาสายติวหนังสือ":"reading", "นักศึกษาหอพักงบจำกัด":"piggy-bank",
  "นักชิมขนมอบ":"wink", "ผู้บริหารสายกาแฟพิเศษ":"tablet-tie", "สายของขวัญพรีเมียม":"money-bag",
  "พนักงานทำงานที่บ้าน":"laptop-sit", "พนักงานกะดึก":"laptop-blue", "พนักงานออฟฟิศพักเที่ยง":"laptop", "ฟรีแลนซ์นั่งทำงานในคาเฟ่":"laptop-trend",
  "ผู้สูงวัยตลาดเช้า":"gardener", "ผู้เกษียณเดินออกกำลังกาย":"happy", "ลูกค้าประจำย่านเก่า":"heart",
  "สายฟิตเนสหลังออกกำลังกาย":"growth-chart", "สายมังสวิรัติ":"plant-basket", "สายลดหวานลดมัน":"checklist",
  "ฝ่ายบุคคลจัดเลี้ยงพนักงาน":"tablet", "พ่อค้าแม่ค้าในตลาด":"shop-sale", "แอดมินสั่งของว่างประชุม":"online-order" };
const archStk = c => ARCH_STK[c.archetype] || SEG_STK[c.segment] || "wink";
const TH_DOW = ["อา","จ","อ","พ","พฤ","ศ","ส"], TH_MON = ["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"], TH_MON_S = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

  get(k, d) { try { const v = localStorage.getItem("belka:" + k); return v ? JSON.parse(v) : d; } catch { return d; } },

async function api(path, body) {

function shrinkImage(file, maxSide = 1600, quality = 0.85) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, maxSide / Math.max(img.width, img.height)), c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      resolve(c.toDataURL("image/jpeg", quality));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("decode")); };
    img.src = url;
  });
}

  else if (a === "ob-menu") { S.ob.step = 4; S.error = null; if (!S.menu) S.menu = [["", null, null], ["", null, null], ["", null, null]]; save(); }
  else if (a === "ob-plan") { if (!menuValid()) { toast("ใส่ชื่อ ราคา และต้นทุนอย่างน้อย 1 เมนูก่อน"); return; } requestPlan(); return; }
  else if (a === "regen") { requestPlan({ newWeek: true }); return; }
  else if (a === "replan") { requestPlan({ pinned: S.pinned || [], personas: S.profile.personas }); return; }
  else if (a === "pickp") { const k = el.dataset.arch, cur = S.profile.personas || [], card = S.personas.cards.find(c => c.archetype === k);
    if (cur.some(p => p.archetype === k)) { if (cur.length === 1) { toast("ต้องเลือกอย่างน้อย 1 กลุ่ม"); return; } S.profile.personas = cur.filter(p => p.archetype !== k); }
    else if (cur.length >= 3) { toast("เลือกได้สูงสุด 3 กลุ่ม"); return; } else S.profile.personas = [...cur, pickOf(card)];
    S.personasChanged = true; save(); }
  else if (a === "pin") { const id = el.dataset.id, all = S.ideas.ranked, r = all.find(x => x.id === id); let c = (S.pinned || []).slice();
    if (c.includes(id)) c = c.filter(x => x !== id);
    else { if (c.length >= 3) { toast("เลือกได้สูงสุด 3 งานต่อสัปดาห์"); return; }
      if (r.is_price_offer && c.some(x => all.find(y => y.id === x).is_price_offer)) { toast("ข้อเสนอราคาใส่ได้ 1 งานต่อสัปดาห์"); return; } c.push(id); }
    S.pinned = c; save(); }
  else if (a === "pin-clear") { S.pinned = []; save(); }
  else if (a === "pin-suggest") { S.pinned = S.ideas.week.map(w => w.id); save(); }
  else if (a === "sheet-open") { S.sheet = el.dataset.v; }
  else if (a === "sheet-close" || a === "sheet-close-bg") { S.sheet = null; }
  else if (a === "go") { S.sheet = null; S.tab = el.dataset.tab; S.focus = null; S.resetScroll = true; save(); render(); loadTab();
    if (el.dataset.anchor) setTimeout(() => { const t = document.getElementById(el.dataset.anchor); if (t) t.scrollIntoView({ behavior: "smooth", block: "start" }); }, 60); return; }
  else if (a === "cal-prev") { S.cal.m--; if (S.cal.m < 0) { S.cal.m = 11; S.cal.y--; } }
  else if (a === "cal-next") { S.cal.m++; if (S.cal.m > 11) { S.cal.m = 0; S.cal.y++; } }
  else if (a === "cal-day") { const k = el.dataset.d, cur = S.sbDays[k]; if (!cur) S.sbDays[k] = { t: "o", n: null }; else if (cur.t === "o") cur.t = "n"; else delete S.sbDays[k]; save(); }
  else if (a === "tab") { S.tab = el.dataset.v; S.focus = null; S.resetScroll = true; save(); render(); loadTab(); return; }
  else if (a === "focus") { S.focus = slot; S.tab = "home"; }
  else if (a === "tick") { const i = +el.dataset.i, c = S.ticks[slot] || []; S.ticks[slot] = c.includes(i) ? c.filter(x => x !== i) : [...c, i]; save(); }
  else if (a === "copy") { const t = S.plan.tasks.find(x => x.slot === slot); copyText(t.caption).then(() => toast("คัดลอกแคปชันแล้ว 📋")); return; }
  else if (a === "ed") { S.editing = slot; S.draft = null; S.issues = null; }
  else if (a === "ed-cancel") { S.editing = null; S.issues = null; S.draft = null; }
  else if (a === "ed-save") { const text = document.getElementById("ed").value.trim();
    try { const r = await api("/api/redline", { text }); if (!r.passed) { S.issues = r.issues; S.draft = text; render(); return; }
      const t = S.plan.tasks.find(x => x.slot === slot); t.caption = text; t.redline = r; S.editing = null; S.issues = null; S.draft = null; save(); toast("บันทึกแล้ว ผ่านการตรวจ ✓"); } catch { toast("ตรวจข้อความไม่ได้"); } }
  else if (a === "done" || a === "skip") { const t = S.plan.tasks.find(x => x.slot === slot); S.status[slot] = a === "done" ? "done" : "skipped"; S.focus = null; S.editing = null; save();
    remember({ type: a, content_id: t.content_id, channel: t.channel_label }); if (a === "done") toast("เยี่ยมมาก! 🎉"); }
  else if (a === "reset") { if (S._arm) { const id = S.shopId; store.clear(); store.set("shopId", id); location.reload(); return; } S._arm = true; toast("แตะ 'เริ่มใหม่' อีกครั้งเพื่อยืนยัน"); setTimeout(() => S._arm = false, 2500); return; }
  else if (a === "swipe") { remember({ type: "swipe", archetype: el.dataset.arch, answer: el.dataset.v }); toast(el.dataset.v === "exactly" ? "จำไว้แล้ว ใช่ร้านคุณ ✓" : el.dataset.v === "similar" ? "จำไว้แล้ว คล้าย ☆" : "จำไว้แล้ว ไม่ใช่ร้านคุณ");
    setTimeout(async () => { try { S.personas = await api("/api/personas", shopCtx()); render(); } catch {} }, 300); return; }
  else if (a === "filter") { S.filter = el.dataset.v; }
  else if (a === "trends") { S.ideas = null; render(); loadTab(); return; }
  else if (a === "save-idea") { remember({ type: "save_idea", content_id: el.dataset.id }); toast("บันทึกไอเดียแล้ว 🔖"); return; }
  else if (a === "ask-idea") { S.chatOpen = true; render(); sendAsk(`ช่วยขยายไอเดีย “${el.dataset.name}” ให้ร้านฉันหน่อย พร้อมแคปชันตัวอย่าง`); return; }
  else if (a === "menu-photo") { document.getElementById("menu-photo").click(); return; }
  else if (a === "menu-cam") { openCamera(); return; }
  else if (a === "menu-sample") { const p = S.profile || S.ob.p; S.menu = (DEFAULT_MENU[p.shop_type] || []).map(r => [...r]); S.menuCalc = null; S.disc = null; S.menuNote = null; save(); }
  else if (a === "calc-disc") { calcDiscounts(); return; }
  else if (a === "menu-add") { const it = menuItems().map(i => [i.name, i.price, i.cost]); if (it.length < 20) it.push(S.profile ? ["เมนูใหม่", 50, null] : ["", null, null]); S.menu = it; S.disc = null; save(); }
  else if (a === "menu-del") { const it = menuItems().map(i => [i.name, i.price, i.cost]); it.splice(+el.dataset.i, 1); S.menu = it; S.menuCalc = null; S.disc = null; save(); }
  else if (a === "calc-menu") { const ms = +document.getElementById("ms").value || null, b0 = +document.getElementById("sb0").value / 100, b1 = +document.getElementById("sb1").value / 100;
    const gp = Object.fromEntries(Object.entries(S.gp).map(([k, v]) => [k, (+v || 0) / 100]));
    try { S.menuCalc = await api("/api/calc/menu", { items: menuItems().filter(i => i.price > 0 && String(i.name).trim()), gp_rates: gp, monthly_sales: ms, platform_share_before: ms ? b0 : null, platform_share_after: ms ? b1 : null }); S.ideas = null; } catch { toast("คำนวณไม่ได้ ตรวจตัวเลขอีกครั้ง"); } }
  else if (a === "calc-promo") { const i = +document.getElementById("pi").value, it = menuItems()[i]; S.promoItem = i;
    try { S.promo = await api("/api/calc/promo", { name: it.name, price: it.price, cost: it.cost, expected_lift: (+document.getElementById("lift").value || 30) / 100, base_units_per_day: +document.getElementById("q0").value || 20 }); } catch { toast("คำนวณไม่ได้ ตรวจตัวเลขอีกครั้ง"); } }
  else if (a === "calc-sb") { const p = [], o = []; Object.values(S.sbDays).forEach(v => { if (v.n != null && !isNaN(v.n)) (v.t === "o" ? p : o).push(v.n); });
    const r = welch(p, o); if (!r) { toast("เลือกวันมีโปรและวันไม่มีโปรอย่างน้อยฝั่งละ 2 วัน แล้วใส่จำนวนลูกค้า"); return; } S.sb = { r, decision: r.ci_low > 0 ? "ทำต่อ" : r.ci_high < 0 ? "หยุดหรือปรับ" : "ทำอีกรอบ" }; }
  else if (a === "chat-open") { S.chatOpen = true; }
  else if (a === "chat-close" || a === "chat-close-bg") { S.chatOpen = false; }
  else if (a === "ask") { const q = document.getElementById("q"); const v = q.value; q.value = ""; sendAsk(v); return; }
  render();
});
/* วัดผลแบบสลับวัน: คำนวณฝั่งหน้าจอเพื่อแสดงผลทันที สูตรเดียวกับ calc.switchback (Welch) */
function welch(a, b) {
  a = a.filter(x => !isNaN(x)); b = b.filter(x => !isNaN(x)); if (a.length < 2 || b.length < 2) return null;
  const m = x => x.reduce((s, v) => s + v, 0) / x.length, v = x => { const mu = m(x); return x.reduce((s, y) => s + (y - mu) ** 2, 0) / (x.length - 1); };
  const v1 = v(a) / a.length, v2 = v(b) / b.length, se = Math.sqrt(v1 + v2), df = se ? (v1 + v2) ** 2 / (v1 ** 2 / (a.length - 1) + v2 ** 2 / (b.length - 1)) : a.length + b.length - 2;
  const T = [[1,12.706],[2,4.303],[3,3.182],[4,2.776],[5,2.571],[6,2.447],[7,2.365],[8,2.306],[9,2.262],[10,2.228],[12,2.179],[15,2.131],[20,2.086],[30,2.042],[60,2.0],[120,1.98]];
  const t = (T.find(([k]) => Math.floor(df) <= k) || [0, 1.96])[1], d = m(a) - m(b);
  return { mean_promo: m(a), mean_other: m(b), diff: d, ci_low: d - t * se, ci_high: d + t * se };
}
if (S.profile && !(S.profile.personas || []).length) {   // ข้อมูลเก่าที่ยังไม่เคยเลือกลูกค้า: พากลับไปเลือกก่อนทำแผน
  const p = S.profile; S.ob = { started: true, step: 3, p: { shop_type: p.shop_type, customer: p.customer, channels: p.channels }, cards: null, sel: [] }; S.profile = null; S.plan = null; S.history = []; S.week = 1; loadObPersonas();
} else { render(); if (S.profile) { if (!S.plan) requestPlan(); else if (S.plan.tasks.every(t => t.date < todayISO())) requestPlan({ newWeek: true }); loadTab(); } }
</script>
